name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 22 * * *'   # 06:00 Asia/Taipei daily: refetch the official timetable for the next four weeks
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Fetch official timetable
        if: github.event_name != 'push'
        env:
          TDX_CLIENT_ID: ${{ secrets.TDX_CLIENT_ID }}
          TDX_CLIENT_SECRET: ${{ secrets.TDX_CLIENT_SECRET }}
        run: python3 scripts/collect.py
      - name: Verify timetable routes
        run: |
          node --check dist/planner.js
          node --check dist/app.js
          node verify.cjs
      - name: Commit refreshed timetable
        if: github.event_name != 'push'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data.json dist/data.js
          git diff --cached --quiet || (git commit -m "data: refresh official timetable $(date -u +%Y-%m-%d)" && git push)
      - name: Stamp build version
        run: sed -i -e "s/__BUILD__/${GITHUB_SHA::7} · $(TZ=Asia/Taipei date +%Y-%m-%d\ %H:%M)/" -e "s/__REV__/${GITHUB_SHA::7}/g" dist/index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
